name: CI

# The merge gate. Before this existed the repository had 1,162 tests and nothing
# that ran them — the tenant isolation suite, which is the only thing standing
# between two client firms' data, could be broken by a commit and merged
# silently. Mutation-verified tests that nothing enforces are documentation.
on:
  push:
    branches: ['**']
  pull_request:
  # Dependency advisories appear without anyone pushing.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [test, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - if: matrix.suite == 'test'
        # `vitest run` is already single-pass; the old `-- --watchAll=false` was
        # a jest flag and vitest rejects it.
        run: npm test
        env:
          CI: true
      - if: matrix.suite == 'build'
        # No INLINE_RUNTIME_CHUNK=false any more. That flag existed because CRA
        # emitted a separate webpack runtime chunk and inlined it into the HTML
        # by default; Vite has no runtime chunk, so there is nothing to inline.
        # The assertion below is what actually holds the line.
        run: npm run build
      - if: matrix.suite == 'build'
        name: Assert the bundle carries no inline script
        # The deployed CloudFront CSP has no 'unsafe-inline' on script-src, so a
        # single inline <script> ships a blank page with a console error and
        # nothing else fails first.
        #
        # This matches any <script> that carries no src=, not the literal
        # '<script>' the CRA-era version looked for. Vite writes its tags with
        # attributes (`<script type="module" crossorigin src=...>`), so the old
        # pattern would have gone on passing while an inline
        # `<script type="module">…</script>` — which is exactly what
        # @vitejs/plugin-legacy injects — sailed through.
        run: |
          BAD=$(grep -o '<script[^>]*>' build/index.html | grep -v 'src=' || true)
          if [ -n "$BAD" ]; then
            echo "::error::build/index.html carries an inline script; the CSP will block it"
            printf '%s\n' "$BAD"
            exit 1
          fi

  server:
    name: Server and tenant isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cre_owner
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cre_owner"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - name: Tests
        working-directory: server
        # Serial by necessity: each file gets its own database, but Postgres
        # ROLES are cluster-wide, so the role statements in the migrations
        # collide across parallel files.
        run: npm test
        env:
          PGHOST_DIR: localhost
          PGPORT: 5432
          PGPASSWORD: ci_only
          TEST_PG_USER: cre_owner

  infra:
    name: Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
        working-directory: infra
      - name: Assertions against the synthesized template
        working-directory: infra
        run: node --test test/*.test.js

  supply-chain:
    name: Dependencies and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Server advisories
        working-directory: server
        # The server's RUNTIME tree ships to production and is held to a high
        # bar. It has no dev dependencies to speak of, so this is honest.
        run: npm audit --omit=dev --audit-level=high

      - name: Frontend advisories
        # One gate over the WHOLE tree, dev dependencies included — no --omit=dev
        # and no ungated companion step.
        #
        # Those two steps existed because every high-severity finding here was
        # transitive through react-scripts and build-time only, so gating on them
        # would have blocked every merge over something that never reached a
        # browser, and a client's security questionnaire could not tell the
        # difference. Vite removed the findings instead of explaining them: the
        # tree audits clean at every severity, so the distinction has nothing
        # left to describe and a real regression now turns this job red.
        run: npm audit --audit-level=high

      # Both trees' dependencies must be resolved before an SBOM can describe
      # them. `npm audit` above does not install.
      - name: Install
        run: |
          npm ci
          (cd server && npm ci)

      - name: Generate SBOM
        # `npm sbom`, built into npm 10, not `npx @cyclonedx/cyclonedx-npm@latest`
        # — which downloads and executes an unpinned package from the registry
        # inside the job whose entire purpose is supply-chain assurance.
        #
        # This is the CI copy, for the audit trail of what each commit resolved
        # to. The one that MATTERS for a running system is generated inside
        # server/Dockerfile and ships in the image, because that is the tree
        # actually deployed; an SBOM produced by a separate install in a separate
        # job describes a tree that resolved at a different moment.
        run: |
          npm sbom --sbom-format cyclonedx > sbom-frontend.json
          (cd server && npm sbom --sbom-format cyclonedx --omit=dev > ../sbom-server.json)

      - name: Assert the SBOMs describe something
        # The previous version ended every generation with `|| echo "skipped"`
        # and uploaded with `if-no-files-found: warn`, so a failure produced a
        # green job, no artifact, and a supply-chain claim with nothing behind
        # it. An SBOM that is absent or empty is worse than one that is missing
        # loudly: the first is mistaken for evidence.
        run: |
          for f in sbom-frontend.json sbom-server.json; do
            n=$(node -e "process.stdout.write(String((require('./$f').components||[]).length))")
            echo "$f: $n components"
            if [ "$n" -lt 1 ]; then
              echo "::error::$f lists no components"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-*.json
          # error, not warn. See above.
          if-no-files-found: error
          # Long enough to answer "was the build we shipped in March affected by
          # this advisory" when the advisory lands in September.
          retention-days: 90

  container:
    name: Container image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t cre-api:ci ./server
      - name: Scan for OS and library vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cre-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
