<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Commercial Real Estate Deal Analyzer - Compare and analyze CRE opportunities"
    />
    <title>CRE Deal Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- Vite's entry point, and the reason this file sits at the repository root
         rather than in public/: Vite treats index.html as a module graph root and
         resolves this src= at build time. A copy left in public/ would be emitted
         verbatim over the built one, shipping a page that loads nothing. -->
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
